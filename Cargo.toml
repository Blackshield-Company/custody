[package]
name = "custody"
version = "0.1.0"
edition = "2021"
description = "Tamper-evident chain-of-custody log for digital evidence"
license = "Apache-2.0"

[dependencies]
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
anyhow = "1"
