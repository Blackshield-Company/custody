[package]
name = "custody-desktop"
version = "0.1.0"
edition = "2021"
description = "Custody desktop — local chain-of-custody log, no network"
license = "Apache-2.0"

[lib]
name = "custody_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "custody-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
custody = { path = ".." }
